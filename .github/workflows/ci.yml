name: ci

on:
  push:
    branches:
      - main
      - dev
      - ci
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"

  pull_request:
    branches:
      - main

permissions:
  contents: write

# Standard format of uploaded asset:
# CanvasSync-${{ github.ref_name }}-${{ matrix.os }}.{app,exe,deb}

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        version: ["6.8.*"]
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set environment variables
        run: |
          echo "ASSET=Canvas-Sync-${{ github.event.pull_request.number || github.ref_name }}-${{ matrix.os }}.dmg" >>$GITHUB_ENV
          echo "QT_STATIC_DIR=$PWD/${{ env.QT_STATIC_DIR }}" >>$GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: mac
          target: desktop
          version: ${{ matrix.version }}
          archives: qtbase qttools

      # build canvas-sync
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Deploy Qt libraries
        run: $QT_ROOT_DIR/bin/macdeployqt "build/Canvas Sync.app"

      # package app
      - run: |
          mkdir -p dmg
          cp -a 'build/Canvas Sync.app' 'dmg/Canvas Sync.app'
          mv ./deploy/mac-readme.txt dmg/README.txt
          ln -s /Applications dmg/Applications
          hdiutil create -volname CanvasSync \
            -srcfolder dmg \
            -fs HFS+ -ov -format UDBZ \
            ${{ env.ASSET }}

      # upload release package
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: ${{ env.ASSET }}
          generate_release_notes: true

  win:
    strategy:
      fail-fast: false
      matrix:
        version: ["6.8.*"]
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "ASSET=Canvas-Sync-Installer-${{ github.event.pull_request.number || github.ref_name }}.exe" >>$GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_msvc2022_64
          version: ${{ matrix.version }}
          setup-python: false
          tools: tools_ifw
          archives: qtbase qttools

      - name: Install MSVC 2022
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install build dependencies
        shell: powershell
        run: choco install ninja -y --no-progress

      - uses: actions/checkout@v5

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build -G Ninja `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Use windeployqt to load libraries
        shell: powershell
        run: |
          $target = "deploy/windows/packages/com.nguyenvukhang.canvassync/data"
          Move-Item "build/Canvas Sync.exe" $target
          Set-Location $target
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" "Canvas Sync.exe"

      - name: Package the installer
        shell: powershell
        run: |
          Set-Location deploy/windows
          $binarycreator = (Get-Command binarycreator.exe -ErrorAction Stop).Source
          $installerbase = Join-Path (Split-Path $binarycreator) 'installerbase.exe'
          Write-Host "Using Qt Installer Framework: $binarycreator"
          Write-Host "Using installer template: $installerbase"
          & $binarycreator --offline-only -t $installerbase -c config/config.xml -p packages -v $env:ASSET
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Move-Item $env:ASSET ../..

      # upload release package
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-2022'
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
