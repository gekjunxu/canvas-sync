name: ci

on:
  push:
    branches:
      - main
      - dev
      - ci
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"

  pull_request:
    branches:
      - main

permissions:
  contents: write

# Standard format of uploaded asset:
# CanvasSync-${{ github.ref_name }}-{platform}.{app,exe,deb}

jobs:
  mac:
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Set environment variables
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="0.0.0"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "ASSET=Canvas-Sync-${{ github.event.pull_request.number || github.ref_name }}-macos-universal.dmg" >>$GITHUB_ENV
          echo "QT_STATIC_DIR=$PWD/${{ env.QT_STATIC_DIR }}" >>$GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: mac
          target: desktop
          arch: clang_64
          version: "6.8.*"
          archives: qtbase qttools

      # build canvas-sync
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build \
            -DCS2_VERSION="$RELEASE_VERSION" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Verify universal app
        run: |
          file "build/Canvas Sync.app/Contents/MacOS/Canvas Sync"
          lipo -info "build/Canvas Sync.app/Contents/MacOS/Canvas Sync"

      - name: Deploy Qt libraries
        run: $QT_ROOT_DIR/bin/macdeployqt "build/Canvas Sync.app"

      - name: Import Apple signing certificate
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          keychain_path="$RUNNER_TEMP/canvas-sync-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/canvas-sync-signing.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign macOS app
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.APPLE_CERTIFICATE_P12_BASE64 != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "build/Canvas Sync.app"
          codesign --verify --deep --strict --verbose=2 "build/Canvas Sync.app"

      # package app
      - run: |
          mkdir -p dmg
          cp -a 'build/Canvas Sync.app' 'dmg/Canvas Sync.app'
          mv ./deploy/mac-readme.txt dmg/README.txt
          ln -s /Applications dmg/Applications
          hdiutil create -volname CanvasSync \
            -srcfolder dmg \
            -fs HFS+ -ov -format UDBZ \
            ${{ env.ASSET }}

      - name: Notarize macOS DMG
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          xcrun notarytool submit "$ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$ASSET"
          xcrun stapler validate "$ASSET"

      # upload release package
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Canvas Sync ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: ${{ env.ASSET }}
          generate_release_notes: true

  win:
    strategy:
      fail-fast: false
      matrix:
        version: ["6.8.*"]
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set environment variables
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="0.0.0"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "ASSET=Canvas-Sync-Installer-${{ github.event.pull_request.number || github.ref_name }}.exe" >>$GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_msvc2022_64
          version: ${{ matrix.version }}
          setup-python: false
          tools: tools_ifw
          archives: qtbase qttools

      - name: Install MSVC 2022
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install build dependencies
        shell: powershell
        run: choco install ninja -y --no-progress

      - uses: actions/checkout@v5

      - name: Set package metadata
        shell: powershell
        run: |
          $version = $env:RELEASE_VERSION
          $releaseDate = Get-Date -Format 'yyyy-MM-dd'

          $configPath = Join-Path $env:GITHUB_WORKSPACE 'deploy/windows/config/config.xml'
          $config = [System.Xml.XmlDocument]::new()
          $config.Load($configPath)
          $config.SelectSingleNode('/Installer/Version').InnerText = $version
          $config.Save($configPath)

          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'deploy/windows/packages/com.nguyenvukhang.canvassync/meta/package.xml'
          $package = [System.Xml.XmlDocument]::new()
          $package.Load($packagePath)
          $package.SelectSingleNode('/Package/Version').InnerText = $version
          $package.SelectSingleNode('/Package/ReleaseDate').InnerText = $releaseDate
          $package.Save($packagePath)

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S . -B build -G Ninja `
            -DCS2_VERSION="$env:RELEASE_VERSION" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --parallel

      - name: Use windeployqt to load libraries
        shell: powershell
        run: |
          $target = "deploy/windows/packages/com.nguyenvukhang.canvassync/data"
          Move-Item "build/Canvas Sync.exe" $target
          Set-Location $target
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" "Canvas Sync.exe"

      - name: Package the installer
        shell: powershell
        run: |
          Set-Location deploy/windows
          $binarycreator = (Get-Command binarycreator.exe -ErrorAction Stop).Source
          $installerbase = Join-Path (Split-Path $binarycreator) 'installerbase.exe'
          Write-Host "Using Qt Installer Framework: $binarycreator"
          Write-Host "Using installer template: $installerbase"
          & $binarycreator --offline-only -t $installerbase -c config/config.xml -p packages $env:ASSET
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Move-Item $env:ASSET ../..

      # upload release package
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-2022'
        with:
          name: Canvas Sync ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
